
server:
  port: 8092  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码、
spring:
  profiles:
    active: dev
  application:
    name: promotion-service
  cloud:
    nacos:
      # 导入配置时必须先能拿到注册中心地址，所以从 application-{profile}.yml 提到这里。
      # 原来放在 bootstrap-{profile}.yml 里，现在那份只剩 discovery 了。
      server-addr: 192.168.150.101:8848
  config:
    # shared-configs 从 SCA 2023.0.1.3 起已废弃（issue #3998），统一改用 spring.config.import。
    # 顺序即优先级：越靠后越高，所以服务专属配置放最后，与原来的语义一致。
    import:
      - nacos:shared-spring.yaml
      - nacos:shared-redis.yaml
      - nacos:shared-mybatis.yaml
      - nacos:shared-logs.yaml
      - nacos:shared-feign.yaml
      - nacos:shared-mq.yaml
      - nacos:shared-xxljob.yaml
      - nacos:shared-seata.yaml
      - nacos:promotion-service.yaml
zw:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhiwei.learning.controller
    title: 知微 - 优惠卷促销接口文档
    description: 该服务包含优惠卷促销相关功能
    contact-name: 知微
    version: v1.0
  jdbc:
    database: zw_promotion
    # 领券落库全是毫秒级单条 SQL，5 秒不返回说明 DB 已经不正常了。
    # 这里比 shared-mybatis.yaml 的全局默认（10 秒）更严，原因见下面 mq 的说明：
    # 消费线程是串行的，一条消息卡多久，后面所有消息就得等多久。
    socket-timeout: 5000
  auth:
    resource:
      enable: true
      exclude-login-paths:
        - /coupons/list
  mq:
    listener:
      # 消费并发度：领券是整个项目里唯一的瞬时热点队列，比 shared-mq.yaml 的全局默认（2/4）高。
      # 为什么需要它：PromotionHandler 内部用 sleep 做退避重试，单条失败要占住线程约 620ms，
      # 只开 1 个消费者时吞吐会从 125 条/秒 掉到 1.6 条/秒，故障期间队列直接积压。
      # 开 4 个之后同样的故障场景吞吐 ×4，代价只是 4 个线程和 4 条 DB 连接。
      concurrency: 4
      max-concurrency: 8
      retry:
        # 说明：PromotionHandler 在方法内自行捕获异常并回滚 Redis，不会把异常抛给框架，
        # 因此这里的框架重试对 coupon.receive.queue 实际不会触发。
        # 系统异常重试耗尽后，由 PromotionHandler 主动转发到 error.promotion-service.queue。
        # 之所以不改造成「抛异常交给框架重试」：回滚需要 UserCouponDTO，而 MessageRecoverer
        # 只能看到 Message；两套重试同时开还会叠加成「方法内 3 次 × 框架 3 次」，
        # 最坏 9 次落库、约 7 秒，并长期占住消费线程。
        stateless: false