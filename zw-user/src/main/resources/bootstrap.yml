server:
  port: 8082  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: user-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
          # ⚠️ 必须有 shared-mq.yaml —— course/data/exam/learning/message 都引入了，user-service 不能漏。
          # 后果：spring.rabbitmq 全部走默认值（localhost:5672），zw-user 在容器里永远连不上 Broker，
          # 发短信的消息一条都发不出去，且 RabbitMqHelper 的返回值被旧代码丢掉，失败完全不可见
          # （表现为：注册页「发送成功」，但短信从未到达，验证码 Redis 链路又是通的，极难排查）。
          - data-id: shared-mq.yaml # 共享MQ配置
            refresh: false
zw:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhiwei.user.controller
    title: 知微 - 用户中心接口文档
    description: 该服务用户管理、用户信息管理
    contact-name: 知微
    version: v1.0
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        # 注册页是匿名的：用户还没账号，不可能带 token 来拿验证码。
        # 不加这一条，前端「发送验证码」会撞上 LoginAuthInterceptor 的 401（裸 HTTP 401，不是业务码）。
        # 放开后这个接口谁都能调，所以 CodeServiceImpl 里必须配 IP 维度限流，不能只靠手机号 60 秒冷却。
        - /code
        - /students/register
        - /users/detail/{isStaff}
        - /users/list
        - GET:/users/{id}
        - /users/{id}/type
        - /users/ids
        - /users/me
  jdbc:
    database: zw_user