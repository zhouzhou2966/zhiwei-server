server:
  port: 8082  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: user-service
  cloud:
    nacos:
      # 导入配置时必须先能拿到注册中心地址，所以从 application-{profile}.yml 提到这里。
      # 原来放在 bootstrap-{profile}.yml 里，现在那份只剩 discovery 了。
      server-addr: 192.168.150.101:8848
    config:
      # shared-configs 从 SCA 2023.0.1.3 起已废弃（issue #3998），统一改用 spring.config.import。
      # 顺序即优先级：越靠后越高，所以服务专属配置放最后，与原来的语义一致。
      import:
        - nacos:shared-spring.yaml
        - nacos:shared-redis.yaml
        - nacos:shared-mybatis.yaml
        - nacos:shared-logs.yaml
        - nacos:shared-feign.yaml
        - nacos:shared-mq.yaml
zw:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhiwei.user.controller
    title: 知微 - 用户中心接口文档
    description: 该服务用户管理、用户信息管理
    contact-name: 知微
    version: v1.0
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        # 注册页是匿名的：用户还没账号，不可能带 token 来拿验证码。
        # 不加这一条，前端「发送验证码」会撞上 LoginAuthInterceptor 的 401（裸 HTTP 401，不是业务码）。
        # 放开后这个接口谁都能调，所以 CodeServiceImpl 里必须配 IP 维度限流，不能只靠手机号 60 秒冷却。
        - /code
        - /students/register
        - /users/detail/{isStaff}
        - /users/list
        - GET:/users/{id}
        - /users/{id}/type
        - /users/ids
        - /users/me
  jdbc:
    database: zw_user