server:
  port: 8084  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: media-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
zw:
  swagger:
    enable: true
    package-path: com.zhiwei.media.controller
    title: 知微 - 媒资中心接口文档
    description: 该服务包含图片管理、媒资管理等
    contact-name: 知微
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /medias/signature/play
  jdbc:
    database: zw_media
  platform:
    # 文件存储切到阿里云 OSS（原 TENCENT 用的是课程方已失效的密钥，上传报 403）
    file: ALI
    # 视频点播仍走腾讯云，头像/图片上传不涉及
    media: TENCENT
  # ⚠️ 前缀和上面不一样：AliConfig 读的是 zw.file.platform，TencentConfig 读的是 zw.platform.file。
  # 两个必须同时设为 ALI —— 只设上面那个会没有 IFileStorage Bean（启动失败），
  # 只设这个会让 URL 前缀与实际上传位置不一致（图片 404）。
  file:
    platform: ALI
  tencent:
    # 凭据（appId / secretId / secretKey / vod.urlKey）不写进代码仓库，
    # 见 Nacos public 命名空间的 media-service.yaml（服务启动时自动加载）
    appId: 
    secretId: 
    secretKey: 
    vod:
      enable: true
      vodValidSeconds: 7776000
      region: "ap-shanghai"
      procedure: "wisehub-base"
      urlKey: 
      pfcg: "basicDrmPreset"
    cos:
      enable: true
      region: "ap-shanghai"
      bucket: wisehub
      multipartUploadThreshold: 5242880 # 5mb，触发分片上传的阈值
      minimumUploadPartSize: 1048576 # 1mb，分片的最小大小