server:
  port: 8085  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: message-service
  cloud:
    nacos:
      # 导入配置时必须先能拿到注册中心地址，所以从 application-{profile}.yml 提到这里。
      # 原来放在 bootstrap-{profile}.yml 里，现在那份只剩 discovery 了。
      server-addr: 192.168.150.101:8848
    config:
      # shared-configs 从 SCA 2023.0.1.3 起已废弃（issue #3998），统一改用 spring.config.import。
      # 顺序即优先级：越靠后越高，所以服务专属配置放最后，与原来的语义一致。
      import:
        - nacos:shared-spring.yaml
        - nacos:shared-redis.yaml
        - nacos:shared-mybatis.yaml
        - nacos:shared-logs.yaml
        - nacos:shared-feign.yaml
        - nacos:shared-mq.yaml
        - nacos:message-service.yaml
zw:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhiwei.message.controller
    title: 知微 - 消息中心接口文档
    description: 该服务用于站内信、通知管理、短信发送等功能
    contact-name: 知微
    version: v1.0
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /students/register
        - /users/detail/{isStaff}
        - /users/list
        - GET:/users/{id}
        - /users/{id}/type
        - /users/ids
        # WS 握手是浏览器原生 WebSocket 发起的，无法携带 user 请求头，
        # 由 HandshakeInterceptor 从 query 里的 token 自行鉴权，故排除登录拦截
        - /ws
  jdbc:
    database: zw_message
  sms:
    ali:
      # 凭据（accessId / accessSecret）不写进代码仓库，
      # 见 Nacos public 命名空间的 message-service.yaml
      accessId: 
      accessSecret: 
