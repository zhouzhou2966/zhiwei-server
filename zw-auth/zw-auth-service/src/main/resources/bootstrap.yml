server:
  port: 8081  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: auth-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
encrypt:
  key-store:
    # 凭据（password / secret）不写进代码仓库，
    # 见 Nacos public 命名空间的 auth-service.yaml
    alias: zw  #别名
    location: classpath:zw.jks  #KeyStore 证书库名称
    password: 
    secret: 
zw:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhiwei.auth.controller
    title: 知微 - 权限微服务接口文档
    description: 该服务用于管理权限相关信息
    contact-name: 知微
    version: v1.0
  auth:
    resource:
      enable: true
      includeLoginPaths:
        - /menus/me
        - /accounts/logout
  jdbc:
    database: zw_auth