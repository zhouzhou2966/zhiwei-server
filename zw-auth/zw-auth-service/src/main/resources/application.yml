server:
  port: 8081  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: auth-service
  cloud:
    nacos:
      # 导入配置时必须先能拿到注册中心地址，所以从 application-{profile}.yml 提到这里。
      # 原来放在 bootstrap-{profile}.yml 里，现在那份只剩 discovery 了。
      server-addr: 192.168.150.101:8848
  config:
    # shared-configs 从 SCA 2023.0.1.3 起已废弃（issue #3998），统一改用 spring.config.import。
    # 顺序即优先级：越靠后越高，所以服务专属配置放最后，与原来的语义一致。
    import:
      - nacos:shared-spring.yaml
      - nacos:shared-redis.yaml
      - nacos:shared-mybatis.yaml
      - nacos:shared-logs.yaml
      - nacos:auth-service.yaml
encrypt:
  key-store:
    # 凭据（password / secret）不写进代码仓库，
    # 见 Nacos public 命名空间的 auth-service.yaml
    alias: zw  #别名
    # 这里**不能**再配 location。密钥库本体走 Nacos 的 zw.auth.jks-base64（见 AuthConfig），
    # 而 spring-cloud-context 的 DecryptEnvironmentPostProcessor 只要看到
    # encrypt.key-store.location 就会去加载它，加载不到直接抛 Invalid keystore location，
    # 根本走不到 AuthConfig 里读 base64 的那段。zw.jks 按「凭据不入库」已从仓库移除，
    # 本地可能还留着残留文件所以能跑，构建机从 Gitee 拉代码构建出的 jar 里没有它，必挂。
    password: 
    secret: 
zw:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhiwei.auth.controller
    title: 知微 - 权限微服务接口文档
    description: 该服务用于管理权限相关信息
    contact-name: 知微
    version: v1.0
  auth:
    resource:
      enable: true
      includeLoginPaths:
        - /menus/me
        - /accounts/logout
  jdbc:
    database: zw_auth